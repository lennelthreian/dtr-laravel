services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: dtr-app
    restart: unless-stopped
    volumes:
      - ./storage/app/public:/var/www/html/storage/app/public
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      DB_DATABASE: dtr_system
      DB_USERNAME: root
      DB_PASSWORD: ""
      ZK_DB_HOST: host.docker.internal
      ZK_DB_PORT: 3306
      ZK_DB_DATABASE: zkbiotime
      ZK_DB_USERNAME: root
      ZK_DB_PASSWORD: ""
      APP_URL: http://192.168.1.151:8082
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dtr-network

  web:
    image: nginx:alpine
    container_name: dtr-nginx
    restart: unless-stopped
    ports:
      - "8082:80"
    depends_on:
      - app
    volumes:
      - .:/var/www/html
      - ./storage/app/public:/var/www/html/public/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - dtr-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dtr-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: host.docker.internal
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ""
      UPLOAD_LIMIT: 100M
    ports:
      - "8081:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - dtr-network

networks:
  dtr-network:
    driver: bridge
